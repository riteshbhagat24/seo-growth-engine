name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["54329:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 3s --health-retries 30
      mailpit:
        image: axllent/mailpit:v1.27
        ports: ["1025:1025", "8025:8025"]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Create database roles and databases
        run: PGPASSWORD=postgres psql -h localhost -p 54329 -U postgres -f docker/postgres-init.sql
      - run: pnpm install --frozen-lockfile
      - name: Local env files with generated secrets
        run: node scripts/dev-env.mjs
      - run: pnpm typecheck
      - run: pnpm --filter @sge/web lint
      # Before the tests: the backlink acceptance suite drives real Chromium (browser-form adapter, egress proxy).
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Unit + integration tests (incl. tenant isolation)
        run: pnpm test
      - run: pnpm db:migrate
      - run: pnpm build:standalone
      - name: End-to-end tests
        run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
